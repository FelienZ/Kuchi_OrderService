openapi: 3.0.0
info:
  title: Order Service API
  description: |
    A production-ready REST API for managing orders, products, and users with JWT-based authentication 
    and role-based access control (RBAC).
    
    **Architecture**: Handler → Service → Repository → Database (PostgreSQL)
    
    **Authentication**: JWT Bearer token stored in HTTP-only cookies
    
    **Roles**: 
    - **Member**: Can create/manage their own orders, view products
    - **Admin**: Full access to all resources, user management, product management
  version: 1.0.0
  contact:
    name: Backend API Support
    email: support@orderservice.local
  license:
    name: MIT

servers:
  - url: http://localhost:5000
    description: Development Server
  # - url: https://api.orderservice.com
  #   description: Production Server

tags:
  - name: Authentication
    description: Login and logout endpoints
  - name: Users
    description: User management and registration
  - name: Products
    description: Product catalog management
  - name: Orders
    description: Order creation and management
  - name: Reports
    description: Transaction logs and analytics

paths:
  # ============================================================
  # AUTHENTICATION ENDPOINTS
  # ============================================================
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: |
        Authenticate user with email and password. Returns JWT token in HTTP-only cookie 
        and user identity in response body.
        
        **Security**: Password is bcrypt-hashed (cost factor 10)
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              member:
                summary: Member Login
                value:
                  email: john@example.com
                  password: securePass123
              admin:
                summary: Admin Login
                value:
                  email: admin@example.com
                  password: adminPassword456
      responses:
        '200':
          description: Login successful - JWT token set in session_id cookie
          headers:
            Set-Cookie:
              schema:
                type: string
                example: session_id=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; Path=/; HttpOnly; Max-Age=900
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  summary: Successful login response
                  value:
                    message: Success Login
                    data:
                      identity:
                        id: user-uuid-123
                        email: user@example.com
                        username: johndoe
                        role: Member
                      access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Invalid credentials (wrong email or password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Session Credentials Invalid
        '400':
          description: Bad request (missing email or password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    delete:
      tags:
        - Authentication
      summary: User Logout
      description: |
        Clear JWT token by invalidating the session_id cookie.
        
        **Security**: Requires valid JWT token in session_id cookie
      operationId: logoutUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful - session_id cookie cleared
          headers:
            Set-Cookie:
              schema:
                type: string
                example: session_id=; Path=/; HttpOnly; Max-Age=-1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: success logout
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # USER ENDPOINTS
  # ============================================================
  /api/user/register:
    post:
      tags:
        - Users
      summary: Register New User
      description: |
        Create a new user account with email and password.
        
        **Validation**:
        - Email must be unique (UNIQUE constraint)
        - Username must be unique (UNIQUE constraint)
        - Password is auto-hashed with bcrypt
        - New users default to `Member` role
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: johndoe
              email: john@example.com
              password: securePass123
      responses:
        '201':
          description: User registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: Register User Success
        '409':
          description: Conflict - email or username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Conflict User Data
        '400':
          description: Bad request - missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/me:
    get:
      tags:
        - Users
      summary: Get Current User Profile
      description: |
        Retrieve the authenticated user's profile information.
        
        **Security**: Requires valid JWT token. Returns only the authenticated user's data.
        
        **Data Includes**:
        - User ID, email, username, and role
        - Account creation and last update timestamps
      operationId: getCurrentUserProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                message: Success Get User Data
                data:
                  id: user-uuid-123
                  username: johndoe
                  email: john@example.com
                  role: Member
                  created_at: '2026-02-15T10:30:00Z'
                  updated_at: '2026-02-15T10:30:00Z'
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Users
      summary: Update Own Profile
      description: |
        Update authenticated user's own profile (email, username, password).
        
        **Security**: Users can only update their own profile
        
        **Validation**:
        - Email and username must remain unique after update
        - Password is auto-hashed before storage
      operationId: updateOwnProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
            example:
              username: johndoe_updated
              email: john.new@example.com
              password: newSecurePass456
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: success update user data
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - email or username already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/user/{id}:
    put:
      tags:
        - Users
      summary: Update User (Admin Only)
      description: |
        Admin-only endpoint to update any user's profile.
        
        **RBAC**: Admin only
        
        **Validation**:
        - Email and username must remain unique after update
        - Password is auto-hashed before storage
      operationId: updateUserAdmin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: user-uuid-123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Users
      summary: Delete User (Admin Only)
      description: |
        Admin-only endpoint to delete a user account.
        
        **RBAC**: Admin only
        
        **Cascading Effects**: Associated orders will be preserved (no cascading delete)
      operationId: deleteUserAdmin
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: user-uuid-123
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: success delete user
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # PRODUCT ENDPOINTS
  # ============================================================
  /api/products:
    get:
      tags:
        - Products
      summary: List All Products
      description: |
        Retrieve all products sorted by creation date (ascending).
        
        **Public Endpoint**: No authentication required
        
        **Performance**: Uses index on (created_at) for efficient sorting
      operationId: getProducts
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              example:
                - id: prod-uuid-001
                  name: Laptop
                  price: 1000000
                  stock: 5
                  created_at: '2026-02-11T09:43:36Z'
                  updated_at: '2026-02-11T09:43:36Z'
                - id: prod-uuid-002
                  name: Mouse
                  price: 100000
                  stock: 20
                  created_at: '2026-02-11T10:00:00Z'
                  updated_at: '2026-02-11T10:00:00Z'

    post:
      tags:
        - Products
      summary: Create Product (Admin Only)
      description: |
        Create a new product in the catalog.
        
        **RBAC**: Admin only
        
        **Validation**:
        - Product name must be unique (UNIQUE constraint)
        - Price must be > 0
        - Stock must be >= 0 (enforced with CHECK constraint)
      operationId: createProduct
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
            example:
              name: Wireless Keyboard
              price: 750000
              stock: 15
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProductResponse'
              example:
                message: Success Created Product
                data: prod-uuid-003
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - product name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request - invalid price or stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/{id}:
    get:
      tags:
        - Products
      summary: Get Product Details
      description: |
        Retrieve a specific product by ID.
        
        **Public Endpoint**: No authentication required
        
        **Performance**: Uses PRIMARY KEY index for O(1) lookup
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: prod-uuid-001
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              example:
                message: Success Get Product
                data:
                  id: prod-uuid-001
                  name: Laptop
                  price: 1000000
                  stock: 5
                  created_at: '2026-02-11T09:43:36Z'
                  updated_at: '2026-02-11T09:43:36Z'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Products
      summary: Update Product (Admin Only)
      description: |
        Update product details (name, price, stock).
        
        **RBAC**: Admin only
        
        **Partial Updates**: Only provided fields are updated
        
        **Validation**:
        - Price must be > 0 if provided
        - Stock must be >= 0 if provided (enforced with CHECK constraint)
      operationId: updateProduct
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: prod-uuid-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
            example:
              name: Laptop Updated
              price: 1200000
              stock: 3
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: success update product data
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad request - invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Products
      summary: Delete Product (Admin Only)
      description: |
        Delete a product from the catalog.
        
        **RBAC**: Admin only
        
        **Cascading Effects**: Associated order_items referencing this product 
        will be deleted (FK ON DELETE CASCADE)
      operationId: deleteProduct
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: prod-uuid-001
      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: success delete product
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # ORDER ENDPOINTS
  # ============================================================
  /api/orders:
    get:
      tags:
        - Orders
      summary: List All Orders (Admin Only)
      description: |
        Retrieve all orders with optional filtering by status, with pagination.
        
        **RBAC**: Admin only
        
        **Query Parameters**:
        - `status`: Filter by PENDING, PAID, or CANCELED
        - `limit`: Number of results (default: 10)
        - `offset`: Pagination offset (default: 0)
        
        **Performance**: Uses index on (status, created_at DESC) for efficient filtering
      operationId: getOrders
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PAID, CANCELED]
          example: PENDING
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          example: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          example: 0
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Orders
      summary: Create Order
      description: |
        Create a new order for the authenticated user.
        
        **Security**: Users can only create orders for themselves
        
        **Transaction Handling**: All order items and stock decrements are committed atomically
        
        **Validation**:
        - All product IDs must exist
        - Quantities must be > 0
        - Products must be in stock (checked during payment)
      operationId: createOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
            example:
              item:
                - product_id: prod-uuid-001
                  qty: 2
                - product_id: prod-uuid-002
                  qty: 1
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreateResponse'
              example:
                message: Success Create Order
                data: order-uuid-123
        '400':
          description: Bad request - invalid product ID or quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/me:
    get:
      tags:
        - Orders
      summary: Get Current User's Orders
      description: |
        Retrieve all orders for the authenticated user.
        
        **Security**: Requires JWT authentication. Returns orders only for the authenticated user 
        (user ID extracted from JWT token context).
        
        **Data Includes**:
        - All orders belonging to the authenticated user
        - Order metadata (id, user_id, status, timestamps)
        - All order items with product details and prices
      operationId: getCurrentUserOrders
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user's orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
                - id: order-uuid-123
                  user_id: user-uuid-123
                  item:
                    - product_id: prod-uuid-001
                      qty: 2
                      total_price: 2000000
                    - product_id: prod-uuid-002
                      qty: 1
                      total_price: 100000
                  status: PAID
                  created_at: '2026-03-02T13:59:55Z'
                  updated_at: '2026-03-02T14:00:06Z'
                - id: order-uuid-124
                  user_id: user-uuid-123
                  item:
                    - product_id: prod-uuid-003
                      qty: 1
                      total_price: 1500000
                  status: PENDING
                  created_at: '2026-03-05T10:20:00Z'
                  updated_at: '2026-03-05T10:20:00Z'
        '401':
          description: Unauthorized - missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get Order Details (Admin Only)
      description: |
        Retrieve detailed information about a specific order including all items.
        
        **RBAC**: Admin only
        
        **Data Includes**:
        - Order metadata (id, user_id, status, timestamps)
        - All order items with product details and prices
      operationId: getOrderById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: order-uuid-123
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
              example:
                message: Success Get Order Data
                data:
                  id: order-uuid-123
                  user_id: user-uuid-123
                  item:
                    - product_id: prod-uuid-001
                      qty: 2
                      total_price: 2000000
                    - product_id: prod-uuid-002
                      qty: 1
                      total_price: 100000
                  status: PAID
                  created_at: '2026-03-02T13:59:55Z'
                  updated_at: '2026-03-02T14:00:06Z'
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Orders
      summary: Delete Order
      description: |
        Delete an order. Only PENDING orders can be deleted.
        
        **Validation**: Order must be in PENDING status
        
        **Cascading Effects**: Associated order_items are deleted (FK ON DELETE CASCADE)
      operationId: deleteOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: order-uuid-123
      responses:
        '200':
          description: Order deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: success delete order
        '400':
          description: Bad request - order cannot be deleted in current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}/pay:
    post:
      tags:
        - Orders
      summary: Pay Order
      description: |
        Process payment for an order and decrease product stock.
        
        **Transaction Handling**:
        - Order status: PENDING → PAID (conditional update)
        - Product stock: Decremented by order item quantities
        - All changes committed atomically
        
        **Safety Features**:
        - Uses conditional WHERE clause to prevent concurrent payment race conditions
        - Stock cannot go negative (enforced with CHECK constraint)
        - Returns error if insufficient stock
        
        **Validation**:
        - Order must be in PENDING status
        - Products must have sufficient stock
      operationId: payOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: order-uuid-123
      responses:
        '200':
          description: Payment processed and order status updated to PAID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: succes pay order
        '400':
          description: |
            Bad request - could be:
            - Order is not in PENDING status
            - Insufficient stock for one or more products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - invalid order status for payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{id}/cancel:
    delete:
      tags:
        - Orders
      summary: Cancel Order
      description: |
        Cancel a pending order. Only PENDING orders can be canceled.
        
        **Validation**: Order must be in PENDING status
        
        **Note**: This only changes status, does not refund or restore stock
      operationId: cancelOrder
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: order-uuid-123
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                message: success cancel order
        '400':
          description: Bad request - order cannot be cancelled in current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # REPORT ENDPOINTS
  # ============================================================
  /api/reports:
    get:
      tags:
        - Reports
      summary: Get Transaction Log (Admin Only)
      description: |
        Retrieve all transaction logs (audit trail) for orders and products.
        
        **RBAC**: Admin only
        
        **Data Provides**:
        - Complete history of CREATE_ORDER, PAY_ORDER, CANCEL_ORDER, DELETE_ORDER actions
        - Product stock changes (SELL actions)
        - Entity type (ORDER, PRODUCT) and entity ID
        - Action timestamps and notes
      operationId: getReport
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Transaction logs retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionLog'
              example:
                - id: log-uuid-001
                  entity: ORDER
                  entity_id: order-uuid-123
                  action: CREATE_ORDER
                  note: Action:Create Order - Status:Pending - Time:2026-03-02 20:59:55
                  created_at: '2026-03-02T13:59:55Z'
                - id: log-uuid-002
                  entity: PRODUCT
                  entity_id: prod-uuid-001
                  action: SELL
                  note: Action:Product Out - Status:Success - Time:2026-03-02 21:00:06
                  created_at: '2026-03-02T14:00:06Z'
        '403':
          description: Forbidden - Admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# ============================================================
# COMPONENTS
# ============================================================
components:
  # ============================================================
  # AUTHENTICATION
  # ============================================================
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token passed via Authorization header or session_id cookie.
        
        **Token Expiration**: 15 minutes
        
        **Algorithm**: HS256 (HMAC SHA-256)
        
        **Payload**:
        ```json
        {
          "user_id": "uuid",
          "iat": 1234567890,
          "exp": 1234568790,
          "nbf": 1234567890
        }
        ```

  # ============================================================
  # SCHEMAS - REQUESTS
  # ============================================================
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: user@example.com
        password:
          type: string
          format: password
          description: User password (plain text, will be compared with bcrypt hash)
          example: securePassword123
          minLength: 1

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          description: Unique username
          example: johndoe
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          description: Unique email address
          example: john@example.com
        password:
          type: string
          format: password
          description: Password (will be bcrypt hashed)
          example: securePassword123
          minLength: 1

    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
          description: New username (must be unique)
          example: johndoe_updated
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          description: New email address (must be unique)
          example: john.new@example.com
        password:
          type: string
          format: password
          description: New password (will be bcrypt hashed)
          example: newSecurePassword456
          minLength: 1

    ProductCreateRequest:
      type: object
      required:
        - name
        - price
        - stock
      properties:
        name:
          type: string
          description: Product name (must be unique)
          example: Wireless Keyboard
          minLength: 1
          maxLength: 255
        price:
          type: integer
          description: Product price in cents (must be > 0)
          example: 750000
          minimum: 1
        stock:
          type: integer
          description: Available stock quantity (must be >= 0)
          example: 15
          minimum: 0

    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Updated product name (must remain unique)
          example: Updated Keyboard
          minLength: 1
          maxLength: 255
        price:
          type: integer
          description: Updated price (must be > 0)
          example: 850000
          minimum: 1
        stock:
          type: integer
          description: Updated stock quantity (must be >= 0)
          example: 10
          minimum: 0

    OrderCreateRequest:
      type: object
      required:
        - item
      properties:
        item:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemCreate'
      example:
        item:
          - product_id: prod-uuid-001
            qty: 2
          - product_id: prod-uuid-002
            qty: 1

    OrderItemCreate:
      type: object
      required:
        - product_id
        - qty
      properties:
        product_id:
          type: string
          format: uuid
          description: Product UUID
          example: prod-uuid-001
        qty:
          type: integer
          description: Quantity to order (must be > 0)
          example: 2
          minimum: 1

    # ============================================================
    # SCHEMAS - RESPONSES
    # ============================================================
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User unique identifier
        username:
          type: string
          description: Unique username
        email:
          type: string
          format: email
          description: Unique email address
        role:
          $ref: '#/components/schemas/UserRole'
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    UserIdentity:
      type: object
      description: Minimal user information for authenticated context
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UserRole:
      type: string
      enum: [Member, Admin]
      description: |
        - **Member**: Regular user, can create/manage own orders
        - **Admin**: Full access to all resources

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Product unique identifier
        name:
          type: string
          description: Product name
        price:
          type: integer
          description: Product price in cents
        stock:
          type: integer
          description: Available stock quantity
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderItem:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
          description: Product UUID
        qty:
          type: integer
          description: Quantity ordered
        total_price:
          type: integer
          description: Total price for this line item (price × qty) in cents

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Order unique identifier
        user_id:
          type: string
          format: uuid
          description: Owner user UUID
        item:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          description: List of ordered items
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date-time
          description: Order creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last status update timestamp

    OrderStatus:
      type: string
      enum: [PENDING, PAID, CANCELED]
      description: |
        - **PENDING**: Order created, awaiting payment
        - **PAID**: Payment processed, stock decremented
        - **CANCELED**: Order cancelled (no refund, stock not restored)

    TransactionLog:
      type: object
      description: Audit trail entry for orders and products
      properties:
        id:
          type: string
          format: uuid
          description: Log entry unique identifier
        entity:
          type: string
          enum: [ORDER, PRODUCT]
          description: Entity type (ORDER or PRODUCT)
        entity_id:
          type: string
          format: uuid
          description: UUID of the entity (order_id or product_id)
        action:
          type: string
          enum: [CREATE_ORDER, PAY_ORDER, CANCEL_ORDER, DELETE_ORDER, SELL]
          description: Action performed on the entity
        note:
          type: string
          description: Human-readable description of the action
        created_at:
          type: string
          format: date-time
          description: When the action occurred

    # ============================================================
    # SCHEMAS - API RESPONSES
    # ============================================================
    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Success Login
        data:
          type: object
          properties:
            identity:
              $ref: '#/components/schemas/UserIdentity'
            access_token:
              type: string
              description: JWT token for authentication
              format: jwt

    ProductResponse:
      type: object
      properties:
        message:
          type: string
          example: Success Get Product
        data:
          $ref: '#/components/schemas/Product'

    UserResponse:
      type: object
      properties:
        message:
          type: string
          example: Success Get User Data
        data:
          $ref: '#/components/schemas/User'

    OrderResponse:
      type: object
      properties:
        message:
          type: string
          example: Success Get Order Data
        data:
          $ref: '#/components/schemas/Order'

    CreateProductResponse:
      type: object
      properties:
        message:
          type: string
          example: Success Created Product
        data:
          type: string
          format: uuid
          description: ID of the created product

    OrderCreateResponse:
      type: object
      properties:
        message:
          type: string
          example: Success Create Order
        data:
          type: string
          format: uuid
          description: ID of the created order

    SuccessMessage:
      type: object
      properties:
        message:
          type: string
          description: Success message

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Error message or description
      example:
        message: Invalid Request Data

  # ============================================================
  # RESPONSE DEFINITIONS
  # ============================================================
  responses:
    UnauthorizedError:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ForbiddenError:
      description: User lacks required permissions/role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFoundError:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ConflictError:
      description: Resource conflict (e.g., duplicate email/username)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    BadRequestError:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

# ============================================================
# INFO & METADATA
# ============================================================
x-project-info:
  architecture:
    pattern: Layered Architecture
    layers:
      - name: Handler Layer
        description: HTTP request/response handling
        location: api/
      - name: Service Layer
        description: Business logic and transaction orchestration
        location: services/
      - name: Repository Layer
        description: Data access abstraction
        location: repository/
      - name: Database Layer
        description: PostgreSQL persistence
        connection: pgxpool

  transaction-safety:
    - description: All multi-step operations use database transactions
    - description: Conditional WHERE clauses prevent race conditions
    - description: Order status transitions enforced with state machine
    - description: Product stock validated before decrement (CHECK constraint + WHERE clause)
    - description: Atomic operations at transaction boundary

  database-constraints:
    unique-constraints:
      - users(email)
      - users(user_name)
      - products(name)
    check-constraints:
      - products.stock >= 0
    foreign-keys:
      - orders.user_id → users.id (ON DELETE CASCADE)
      - order_items.order_id → orders.id (ON DELETE CASCADE)
      - order_items.product_id → products.id (ON DELETE CASCADE)

  recommended-indexes:
    - name: idx_orders_user_id
      table: orders
      columns: [user_id]
      benefit: FindByUserID queries
    - name: idx_orders_status_created
      table: orders
      columns: [status, created_at DESC]
      benefit: Filtered list queries with sorting
    - name: idx_order_items_order_id
      table: order_items
      columns: [order_id]
      benefit: JOIN operations in FindByID
    - name: idx_order_items_product_id
      table: order_items
      columns: [product_id]
      benefit: Product lookup in orders
    - name: idx_products_created
      table: products
      columns: [created_at DESC]
      benefit: Sorted product listing

  error-handling:
    strategy: Three-layer translation
    layers:
      - name: Database Layer
        errors: [ErrNoRows, ErrNoUpdate, ErrUniqueViolated, ErrForeignViolated, ErrCheckViolated]
      - name: Service Layer
        errors: [Domain-specific errors with business meaning]
      - name: HTTP Layer
        mapping: [Domain errors → HTTP status codes]
